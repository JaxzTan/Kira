<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kira entry detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#0F766E}a:hover{color:#0B5B55}
</style>
</helmet>
<div style="min-height: 100vh; background: #F6F7F5; color: #14171A; font-family: Inter, system-ui, sans-serif; display: flex; flex-wrap: wrap">
  <aside style="flex: 1 1 220px; max-width: 260px; background: #14171A; color: #F6F7F5; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px"><div style="width: 34px; height: 34px; border-radius: 10px; background: #0F766E; display: flex; align-items: center; justify-content: center; font: 700 18px 'Space Grotesk', sans-serif; color: #FFFFFF">K</div><div style="font: 700 20px 'Space Grotesk', sans-serif">Kira</div></div>
    <nav style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4"><a href="{{n.href}}" style="height: 44px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; font-size: 14px; font-weight: 500; text-decoration: none; color: {{n.fg}}; background: {{n.bg}}">{{n.label}}</a></sc-for>
    </nav>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; max-width: 1240px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5B6168"><a href="Add.dc.html" style="text-decoration: none; font-weight: 600">Entries</a><span aria-hidden="true">/</span><span style="font-family: 'JetBrains Mono', monospace">#126</span></div>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <section style="flex: 1 1 380px; background: #FFFFFF; border: 1px solid #E4E7E2; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font: 600 24px 'Space Grotesk', sans-serif">GitHub Copilot</h1><div style="font-size: 14px; color: #5B6168">Software &amp; subscriptions</div></div>
          <div style="font: 700 34px 'Space Grotesk', sans-serif; letter-spacing: -0.5px">RM 44.80</div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; font-size: 14px">
          <div style="display: flex; flex-direction: column; gap: 4px"><div style="color: #5B6168; font-size: 12px; font-weight: 600">Date</div><div style="font-weight: 600">8 Nov 2026</div></div>
          <div style="display: flex; flex-direction: column; gap: 4px"><div style="color: #5B6168; font-size: 12px; font-weight: 600">Paid with</div><div style="font-weight: 600">Card</div></div>
          <div style="display: flex; flex-direction: column; gap: 4px"><div style="color: #5B6168; font-size: 12px; font-weight: 600">Status</div><div style="font-weight: 600">Amended once</div></div>
          <div style="display: flex; flex-direction: column; gap: 4px"><div style="color: #5B6168; font-size: 12px; font-weight: 600">Note</div><div style="font-weight: 600">Monthly plan, Nov</div></div>
        </div>
        <div style="height: 180px; border: 1px dashed #C8CCC6; border-radius: 12px; background: #FAFBF9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #5B6168; font-size: 13px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h9l5 5v15H6z"></path><path d="M14 2v6h6"></path></svg>
          receipt.pdf · preview
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px">sha256 3e9a…c41f</div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <button style="height: 44px; padding: 0 18px; border-radius: 10px; border: 1.5px solid #0F766E; background: #FFFFFF; color: #0F766E; font: 600 14px Inter, sans-serif; cursor: pointer">Correct entry</button>
          <button style="height: 44px; padding: 0 18px; border-radius: 10px; border: 1.5px solid #B3261E; background: #FFFFFF; color: #B3261E; font: 600 14px Inter, sans-serif; cursor: pointer">Void…</button>
        </div>
      </section>

      <section style="flex: 1 1 320px; background: #FFFFFF; border: 1px solid #E4E7E2; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">History</h2>
        <sc-for list="{{history}}" as="h" hint-placeholder-count="2">
          <div style="display: flex; gap: 12px">
            <div style="display: flex; flex-direction: column; align-items: center; padding-top: 4px"><div style="width: 12px; height: 12px; border-radius: 999px; background: {{h.dot}}"></div><div style="width: 2px; flex-grow: 1; background: #DADDD8"></div></div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; padding-bottom: 16px">
              <div style="display: flex; justify-content: space-between; font-size: 13px"><div style="font-weight: 600">{{h.title}}</div><div style="color: #5B6168">{{h.when}}</div></div>
              <div style="font-size: 13px; color: #3A3F44">{{h.body}}</div>
              <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5B6168">{{h.hash}}</div>
            </div>
          </div>
        </sc-for>
        <div style="display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 10px; background: #E3F1EE; color: #0B5B55; font-size: 13px; font-weight: 500">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
          Chain verified · originals are never overwritten
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const nav = [['Dashboard','Main.dc.html'],['Entries','Add.dc.html'],['Export','#'],['Settings','#']];
    return {
      nav: nav.map((n, i) => ({ label: n[0], href: n[1], fg: i === 1 ? '#FFFFFF' : '#B9BFBA', bg: i === 1 ? '#2A2F33' : 'transparent' })),
      history: [
        { title: 'Amended', when: '8 Nov, 21:14', body: 'Amount RM 48.00 → RM 44.80 (matched card statement)', hash: '#127 · 9f1c…a03e', dot: '#0F766E' },
        { title: 'Created', when: '8 Nov, 10:02', body: 'RM 48.00 · Software & subscriptions · Card', hash: '#126 · 4b7e…11d9', dot: '#9AA09B' }
      ]
    };
  }
}
</script>
</body>
</html>
